[package]
name = "pywr-core"
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["pyo3"]
clp = ["dep:coin-or-sys", "coin-or-sys/clp"]
cbc = ["dep:coin-or-sys", "coin-or-sys/cbc"]
highs = ["dep:highs-sys"]
ipm-ocl = ["dep:ipm-ocl", "dep:ocl"]
ipm-simd = ["dep:ipm-simd", "dep:wide"]
microlp = ["dep:microlp"]
pyo3 = ["dep:pyo3", "dep:ahash"]
# File formats
hdf5 = ["dep:hdf5-metno"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = { workspace = true, optional = true }
coin-or-sys = { path = "../coin-or-sys", optional = true }
csv = { workspace = true }
float-cmp = { workspace = true }
hdf5-metno = { workspace = true, optional = true }
highs-sys = { workspace = true, optional = true }
ipm-ocl = { path = "../ipm-ocl", optional = true }
ipm-simd = { path = "../ipm-simd", optional = true }
jiff = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
microlp = { workspace = true, optional = true }
nalgebra = { workspace = true }
ndarray = { workspace = true }
num = { workspace = true }
ocl = { workspace = true, optional = true }
pyo3 = { workspace = true, features = ["jiff-02", "macros"], optional = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
wide = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "random_models"
harness = false

name: Rust (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # Make sure CI fails on all warnings, including Clippy lints
  RUSTFLAGS: "-Dwarnings"

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    name: Build (stable)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo format
        run: cargo fmt --all -- --check
      - uses: swatinem/rust-cache@v2
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install Intel OpenCL
        run: sudo apt-get install -y intel-opencl-icd ocl-icd-opencl-dev
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features --all
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: mdbook@0.4.52
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-hack@0.6
      - name: Check (pywr-core)
        run: cargo hack check --each-feature --no-dev-deps -p pywr-core
      - name: Check (pywr-schema)
        run: cargo hack check --each-feature --no-dev-deps -p pywr-schema
      - name: Build
        run: cargo build --locked --verbose --all-features --workspace --exclude pywr-python
      - name: Run tests
        run: cargo test --locked --all --exclude pywr-python --exclude ipm-ocl --features highs,cbc,microlp,ipm-simd --verbose -- --test-threads=1
      - name: Run mdbook test & build
        run: |
          output=$(mdbook test ./pywr-book 2>&1)
          if echo "$output" | grep -q "\[ERROR\]" ; then
              exit 1
          fi

          output=$(mdbook build ./pywr-book 2>&1)
          if echo "$output" | grep -q "\[ERROR\]" ; then
              exit 1
          fi

  build_msrv:
    name: Build (v1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.96
      - name: Run tests
        run: cargo test --locked --all --exclude pywr-python --exclude ipm-ocl --features highs,cbc,microlp,ipm-simd --verbose -- --test-threads=1

  #    strategy:
  #      matrix:
  #        platform:
  #          - runner: ubuntu-24.04
  #            target: x86_64
  #    steps:
  #      - uses: actions/checkout@v7
  #        with:
  #          ref: ${{ github.sha }}
  #          submodules: true
  #      - uses: actions/setup-python@v7
  #        with:
  #          python-version: 3.13
  #      - name: Build wheels
  #        uses: PyO3/maturin-action@v1
  #        with:
  #          target: ${{ matrix.platform.target }}
  #          args: --release --out dist -i python3.13
  #          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
  #          manylinux: musllinux_1_2
  #      - name: Upload wheels
  #        uses: actions/upload-artifact@v7
  #        with:
  #          name: wheels-musllinux-${{ matrix.platform.target }}
  #          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    environment: pypi
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted }}
    needs: [ validate-release, rust-linux, rust-windows, python-tests, linux, windows, macos, sdist ]
    permissions:
      # Used for trusted publishing and artifact attestation
      id-token: write
      contents: read
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

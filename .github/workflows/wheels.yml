# Originally generated by maturin; preserve the release gate and regular-CPython-only
# builds when regenerating this workflow.
name: Python Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check tag against package version
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          def read_toml(path):
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))

          version = read_toml("Cargo.toml")["workspace"]["package"]["version"]
          # Release tags use Cargo spelling: v2.0.0 or v2.0.0-rc1, not v2.0.0rc1.
          number = r"(?:0|[1-9][0-9]*)"
          pattern = rf"{number}\.{number}\.{number}(?:-(?:alpha|beta|rc){number})?"
          if re.fullmatch(pattern, version) is None:
              raise SystemExit(f"Unsupported release version: {version}")
          expected_tag = f"v{version}"
          if os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(f"Release tag must match Cargo.toml: {expected_tag}")

          # Maturin derives the Python version from this workspace version.
          project = read_toml("pyproject.toml")
          manifest = project["tool"]["maturin"]["manifest-path"]
          if (
              project["project"]["name"] != "pywr"
              or "version" not in project["project"].get("dynamic", [])
              or manifest != "pywr-python/Cargo.toml"
              or read_toml(manifest)["package"]["version"] != {"workspace": True}
          ):
              raise SystemExit("Python package must inherit the workspace release version")
          print(f"Validated release {expected_tag} at {os.environ['GITHUB_SHA']}")

  # Local reusable workflows use this same commit, not a moving branch. These
  # additional checks run only for releases; regular pushes/PRs have their own CI.
  rust-linux:
    needs: validate-release
    uses: ./.github/workflows/linux.yml

  rust-windows:
    needs: validate-release
    uses: ./.github/workflows/windows.yml

  python-tests:
    needs: validate-release
    uses: ./.github/workflows/python.yml

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.14
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: manylinux_2_28
          before-script-linux: |
            dnf install -y clang
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  # Disabled due to difficulty building zlib on musllinux_1_2 image. Revisit when there is an updated release.
  #  musllinux:
  #    runs-on: ${{ matrix.platform.runner }}
  #    strategy:
  #      matrix:
  #        platform:
  #          - runner: ubuntu-24.04
  #            target: x86_64
  #    steps:
  #      - uses: actions/checkout@v7
  #        with:
  #          submodules: true
  #      - uses: actions/setup-python@v7
  #        with:
  #          python-version: 3.14
  #      - name: Build wheels
  #        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
  #        with:
  #          target: ${{ matrix.platform.target }}
  #          args: --locked --release --out dist -i python3.14
  #          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
  #          manylinux: musllinux_1_2
  #      - name: Upload wheels
  #        uses: actions/upload-artifact@v7
  #        with:
  #          name: wheels-musllinux-${{ matrix.platform.target }}
  #          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.14
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.14
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  wheel-tests:
    name: Wheel tests / ${{ matrix.platform.runner }} / Python ${{ matrix.python }}
    needs: [ linux, windows, macos ]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Test the minimum and latest stable regular CPython, not free-threaded Python.
        python: [ '3.11', '3.14' ]
        platform:
          - runner: ubuntu-24.04
            architecture: x64
            artifact: wheels-linux-x86_64
          - runner: windows-latest
            architecture: x64
            artifact: wheels-windows-x64
          - runner: macos-15-intel
            architecture: x64
            artifact: wheels-macos-x86_64
          - runner: macos-15
            architecture: arm64
            artifact: wheels-macos-aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.architecture }}
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform.artifact }}
          path: ${{ runner.temp }}/downloaded-wheel
      - name: Install and test the built wheel outside the checkout
        shell: python
        run: |
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          import textwrap
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"])
          temp = Path(os.environ["RUNNER_TEMP"])
          work = Path(tempfile.mkdtemp(prefix="wheel-test-", dir=temp))
          wheels = list((temp / "downloaded-wheel").rglob("*.whl"))
          assert len(wheels) == 1, f"Expected one platform wheel, found: {wheels}"
          wheel = wheels[0]
          assert wheel.name.startswith("pywr-") and "-cp310-abi3-" in wheel.name, wheel

          def run(*args):
              subprocess.run([str(arg) for arg in args], cwd=work, check=True)

          venv = work / "venv"
          run(sys.executable, "-I", "-m", "venv", venv)
          python = venv / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          run(python, "-I", "-m", "pip", "install", "--upgrade", "pip")
          # Install the exact artifact, never an editable/source install or PyPI's pywr.
          # Resolve binary dependencies as a fresh user installation would.
          run(python, "-I", "-m", "pip", "install", "--only-binary=:all:", wheel)
          run(python, "-I", "-c", textwrap.dedent("""
              import sys
              import sysconfig
              from importlib.metadata import version
              from pathlib import Path
              import pywr
              import pywr._pywr as native

              assert not sysconfig.get_config_var("Py_GIL_DISABLED")
              for module in (pywr, native):
                  origin = Path(module.__file__).resolve()
                  assert origin.is_relative_to(Path(sys.prefix).resolve()), origin
                  print(origin)
              assert version("pywr") == sys.argv[1], version("pywr")
              print("Testing pywr", version("pywr"), "on", sys.version)
          """), wheel.name.split("-")[1])
          run(python, "-I", "-m", "pywr", "--help")

          run(python, "-I", "-m", "pip", "install", "--only-binary=:all:",
              f"{wheel}[pandas,polars,excel,hdf]", "pytest", "numpy")
          run(python, "-I", "-m", "pip", "check")
          tests = work / "tests"
          shutil.copytree(repo / "pywr-python/tests", tests,
                          ignore=shutil.ignore_patterns("__pycache__", "*.pyc"))
          run(python, "-I", "-m", "pytest", "--import-mode=importlib", "-ra", tests)

          data = tests / "models/simple-time-series"
          output = work / "cli-output"
          output.mkdir()
          run(python, "-I", "-m", "pywr", "run", data / "model.json",
              "--solver", "clp", "--data-path", data, "--output-path", output)
          assert (output / "outputs.h5").is_file(), "CLI did not produce its output"

  release:
    name: Release
    environment: pypi
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted }}
    needs: [ validate-release, rust-linux, rust-windows, python-tests, linux, windows, macos, sdist, wheel-tests ]
    permissions:
      # Used for trusted publishing and artifact attestation
      id-token: write
      contents: read
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          skip-existing: true
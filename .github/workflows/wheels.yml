# Originally generated by maturin; preserve the release gate and regular-CPython-only
# builds when regenerating this workflow.
name: Python Wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release tag
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check tag against package version
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          def read_toml(path):
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))

          version = read_toml("Cargo.toml")["workspace"]["package"]["version"]
          # Release tags use Cargo spelling: v2.0.0 or v2.0.0-rc1, not v2.0.0rc1.
          number = r"(?:0|[1-9][0-9]*)"
          pattern = rf"{number}\.{number}\.{number}(?:-(?:alpha|beta|rc){number})?"
          if re.fullmatch(pattern, version) is None:
              raise SystemExit(f"Unsupported release version: {version}")
          expected_tag = f"v{version}"
          if os.environ["GITHUB_REF_NAME"] != expected_tag:
              raise SystemExit(f"Release tag must match Cargo.toml: {expected_tag}")

          # Maturin derives the Python version from this workspace version.
          project = read_toml("pyproject.toml")
          manifest = project["tool"]["maturin"]["manifest-path"]
          if (
              project["project"]["name"] != "pywr"
              or "version" not in project["project"].get("dynamic", [])
              or manifest != "pywr-python/Cargo.toml"
              or read_toml(manifest)["package"]["version"] != {"workspace": True}
          ):
              raise SystemExit("Python package must inherit the workspace release version")
          print(f"Validated release {expected_tag} at {os.environ['GITHUB_SHA']}")

  # Local reusable workflows use this same commit, not a moving branch. These
  # additional checks run only for releases; regular pushes/PRs have their own CI.
  rust-linux:
    needs: validate-release
    uses: ./.github/workflows/linux.yml

  rust-windows:
    needs: validate-release
    uses: ./.github/workflows/windows.yml

  python-tests:
    needs: validate-release
    uses: ./.github/workflows/python.yml

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.13
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: manylinux_2_28
          before-script-linux: |
            dnf install -y clang
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  # Disabled due to difficulty building zlib on musllinux_1_2 image. Revisit when there is an updated release.

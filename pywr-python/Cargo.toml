[package]
name = "pywr-python"
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "pywr"
crate-type = ["cdylib"]

[features]
default = ["clp", "cbc", "highs", "microlp"]
clp = ["pywr-core/clp", "pywr-schema/clp", "pywr-runner-service/clp"]
cbc = ["pywr-core/cbc", "pywr-schema/cbc", "pywr-runner-service/cbc"]
highs = ["pywr-core/highs", "pywr-schema/highs", "pywr-runner-service/highs"]
microlp = ["pywr-core/microlp", "pywr-schema/microlp", "pywr-runner-service/microlp"]
ipm-ocl = ["pywr-core/ipm-ocl", "pywr-schema/ipm-ocl"]
ipm-simd = ["pywr-core/ipm-simd", "pywr-schema/ipm-simd"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
arrow = { workspace = true }
jiff = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module", "macros", "jiff-02", "abi3-py310"] }
pyo3-log = { workspace = true }
pywr-core = { path = "../pywr-core" }
pywr-runner-service = { path = "../pywr-runner-service" }
pywr-schema = { path = "../pywr-schema" }
pywr-v1-schema = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

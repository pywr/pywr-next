[workspace]
resolver = "3"
members = [
    "coin-or-sys",
    "ipm-common",
    "ipm-ocl",
    "ipm-simd",
    # These are the listings for the book
    "pywr-book/listings/*",
    "pywr-cli",
    "pywr-core",
    "pywr-python", "pywr-runner-engine",
    "pywr-runner-protocol", "pywr-runner-service", "pywr-runner-transport",
    "pywr-schema",
    "pywr-schema-macros",
]

# IPM packages are not default because they require nightly (portable_simd).
default-members = [
    "coin-or-sys",
    "pywr-core",
    "pywr-schema",
    "pywr-cli",
    # "pywr-python",
]

[workspace.package]
readme = "README.md"
description = "A generalised water resource allocation model."
version = "2.0.0-beta6"
edition = "2024"
rust-version = "1.85"
authors = ["James Tomlinson <tomo.bbe@gmail.com>"]
repository = "https://github.com/pywr/pywr-next/"
license = "MIT OR Apache-2.0"
keywords = ["water", "modelling"]
categories = ["science", "simulation"]

[workspace.dependencies]
ahash = "0.8"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = "4.6"
csv = "1.4"
criterion = "0.8"
digest = "0.11"
digest-io = "0.1"
env_logger = "0.11"
float-cmp = "0.10"
hdf5-metno = { version = "0.14", features = ["static", "zlib"] }
highs-sys = "1.14"
heck = "0.5"
hex = "0.4.3"
interprocess = "2.4"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
log = "0.4"
md-5 = "0.11"
microlp = "0.6.0"
ndarray = "0.17"
nalgebra = "0.35"
nalgebra-sparse = "0.12"
num = "0.4"
ocl = "0.19"
polars = { version = "0.55", default-features = false }
pyo3 = { version = "0.29" }
pyo3-log = "0.13"
pyo3-polars = { version = "0.28", default-features = false }
pywr-v1-schema = "0.24"
quote = "1.0"
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
rayon = "1.12"
schemars = { version = "1.2", features = ["jiff02"] }
serde = { version = "1", features = ["derive", ] }
serde_json = "1.0"
sha2 = "0.11"
strum = "0.28"
strum_macros = "0.28"
syn = "3.0"
tempfile = "3.27"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
wide = "1.4.0"

[workspace.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]

[profile.dev]
# Disabling debug info speeds up builds a bunch,
# and we don't rely on it for debugging that much.
# debug = 0

[profile.release]
opt-level = 3
# lto = true
# strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
